<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiPass Video (JS)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🎬</div>
    <div>
      <h1>ThaiPass Video</h1>
      <p>👤 ThaiPass User (Demo) • JS App • WebApp เล่นวิดีโอ</p>
    </div>
  </header>

  <div class="ai-bar">
    <span id="aiMsg">🤖 AI ThaiPass: สวัสดี! พร้อมดูวิดีโอแล้ว</span>
    <button id="aiBtn" title="ให้ AI แนะนำวิดีโอ">✨ AI แนะนำ</button>
  </div>

  <div class="card">
    <video id="video" preload="metadata" playsinline></video>
    <div class="meta">
      <h2 id="title">No video selected</h2>
      <p id="artist">กด + เพิ่มวิดีโอ แล้วกดเล่น</p>
      <input type="range" id="progress" value="0" min="0" max="1000">
      <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button id="shuf" class="btn dim" title="Shuffle">🔀</button>
      <button id="prev" class="btn navy" title="Previous">⏮</button>
      <button id="play" class="btn green big" title="Play/Pause">▶</button>
      <button id="next" class="btn navy" title="Next">⏭</button>
      <button id="rep" class="btn dim" title="Repeat">🔁</button>
      <button id="full" class="btn navy" title="Fullscreen">⛶</button>
    </div>
    <div class="vol-row">
      <span>🔊</span>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
      <span id="count" class="count">0 videos</span>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 ค้นหาวิดีโอ...">
    <label for="file" class="add">+ เพิ่มวิดีโอ</label>
    <input type="file" id="file" accept="video/*" multiple hidden>
  </div>

  <ul id="list"></ul>
  <p class="hint">รองรับ .mp4 / .webm / .mkv • ดับเบิลคลิกเพื่อเล่น • ลากแถบเพื่อกรอวิดีโอ</p>
</div>
<script src="app.js"></script>
</body>
</html>
